[project]
name = "joyeriablanco-backend"
version = "0.1.0"
description = "API de gestión de Joyería Blanco (facturación, presupuestos y clientes)"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.54,<0.55",
    "sqlalchemy[asyncio]>=2.1,<2.2",
    "psycopg[binary]>=3.3,<3.4",
    "alembic>=1.20,<1.21",
    "pydantic>=2.13,<2.14",
    "pydantic-settings>=2.15,<2.16",
    "email-validator>=2.3,<2.4",
    "argon2-cffi>=25.1,<25.2",
    "pycountry>=26.2",
    "typer>=0.27,<0.28",
    "python-json-logger>=4.2,<4.3",
]

[project.scripts]
joyeria = "app.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1,<9.2",
    "pytest-asyncio>=1.4,<1.5",
    "pytest-cov>=7.1",
    "httpx>=0.28,<0.29",
    "ruff>=0.16,<0.17",
    "mypy>=2.3,<2.4",
    "faker>=40.39",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# --------------------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["alembic/versions/__pycache__"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF", "DTZ", "ASYNC", "C4", "PT", "RET", "PTH",
    "T20", "N",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # tildes y signos del español en textos y comentarios
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004"]
"alembic/versions/**" = ["E501"]

[tool.ruff.format]
quote-style = "double"

# --------------------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true
exclude = ["^alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pycountry.*", "faker.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-ra --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
