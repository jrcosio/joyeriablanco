openapi: 3.1.0
info:
  title: Joyería Blanco — API de gestión (feature 004, modalidad No VERI*FACTU)
  version: 0.4.0
  description: |
    Contrato de la feature 004. **Solo contiene las operaciones nuevas.** La API completa es la
    unión de `specs/*/contracts/openapi.yaml`, y el test de contrato compara la aplicación con esa
    unión. Siguen vigentes las convenciones de 001 a 005: autenticación, CSRF, errores RFC 9457 y
    fechas RFC 3339.

    **Ampliación de esquemas de 002**, con la marca «ampliado en 004» en su contrato:
    - `ConfiguracionFacturacionSalida.certificado` (`EstadoCertificado`).
    - `ParametrosFacturacionSalida`: `faltan` admite `certificado`; + `certificado_caduca_el`.
    - `ConfiguracionFacturacionEntrada.modalidad`: `verifactu` se rechaza con 422.
    - `RegistroResumen`: + `firmado`, `certificado_titular`, `huella_correcta` y `firma_correcta`
      (Orden, arts. 6.b y 6.d). `estado_remision` admite `no_aplica`.
    - Las operaciones que generan registros (emitir, emitir un borrador, modificar y anular)
      responden 409 `emision-no-disponible` con `faltan: ["certificado"]` y el `motivo` si el
      certificado no es utilizable.
    - En No VERI*FACTU, `cadena-inconsistente` ya no bloquea la emisión (research R-5).

    **Errores nuevos** (`/problemas/...`):

    | `type` | Estado | Notas |
    |---|---|---|
    | `sin-registros` | 422 | La exportación de un periodo sin registros |
servers:
  - url: /api
tags:
  - name: registro-fiscal
  - name: sistema

paths:
  /v1/alarmas:
    get:
      tags: [registro-fiscal]
      summary: Alarmas activas de integridad y de certificado (Orden, art. 6.f). Cualquier sesión
      responses:
        "200":
          description: Alarmas activas. La lista está vacía si no hay ninguna
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlarmasSalida" }
        "401": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/NoAutenticado" }

  /v1/sistema:
    get:
      tags: [sistema]
      summary: Datos del sistema informático y declaración responsable vigente (RRSIF, art. 13; Orden, art. 15). Cualquier sesión
      responses:
        "200":
          description: Sistema y declaración
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SistemaSalida" }
        "401": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/NoAutenticado" }

  /v1/sistema/declaracion-responsable/pdf:
    get:
      tags: [sistema]
      summary: Declaración responsable en PDF (Orden, art. 15.3). Cualquier sesión
      responses:
        "200":
          description: PDF de la declaración
          headers:
            Content-Disposition: { schema: { type: string }, example: 'inline; filename="declaracion-responsable-0.4.0.pdf"' }
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/NoAutenticado" }

  /v1/registro-fiscal/eventos:
    get:
      tags: [registro-fiscal]
      summary: Registro de eventos, del más reciente al más antiguo (RRSIF, art. 8.3). Solo administradores
      parameters:
        - { name: tipo, in: query, schema: { $ref: "#/components/schemas/TipoEventoSif" } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - { name: pagina, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: tamano, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: Página de eventos
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginaEventosSif" }
        "403": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Prohibido" }

  /v1/registro-fiscal/eventos/{secuencia}:
    parameters: [{ $ref: "#/components/parameters/Secuencia" }]
    get:
      tags: [registro-fiscal]
      summary: Un evento, con sus datos propios y los saltos al anterior y al siguiente (Orden, arts. 7.h y 9.3)
      responses:
        "200":
          description: Evento
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EventoSifDetalle" }
        "403": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Prohibido" }
        "404": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/NoEncontrado" }

  /v1/registro-fiscal/registros/{secuencia}:
    parameters: [{ $ref: "#/components/parameters/Secuencia" }]
    get:
      tags: [registro-fiscal]
      summary: Un registro de facturación de la cadena, con los saltos al anterior y al siguiente (Orden, art. 7.h)
      responses:
        "200":
          description: Registro
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistroCadenaDetalle" }
        "403": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Prohibido" }
        "404": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/NoEncontrado" }

  /v1/registro-fiscal/comprobaciones:
    post:
      tags: [registro-fiscal]
      summary: Comprobar la integridad de toda o parte de la cadena, bajo demanda (Orden, arts. 6.b a 6.e). Genera sus eventos
      parameters: [{ $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/parameters/Csrf" }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComprobacionEntrada" }
      responses:
        "201":
          description: Comprobación hecha, con su resultado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComprobacionSalida" }
        "403": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Prohibido" }
        "409": { description: "`emision-no-disponible`: no se pueden firmar sus eventos sin certificado", $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Problema" }
        "422": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Validacion" }

  /v1/registro-fiscal/exportacion:
    get:
      tags: [registro-fiscal]
      summary: Exportar en ZIP los registros de un periodo, tal como se firmaron (Orden, art. 8.2). Genera el evento 08 o 09
      description: |
        Es un GET sin CSRF, como los PDF de 003: la descarga es una navegación. Su único efecto es
        generar el evento de exportación, que solo puede provocar un administrador con sesión.
      parameters:
        - { name: tipo, in: query, required: true, schema: { type: string, enum: [facturacion, eventos] } }
        - { name: desde, in: query, required: true, schema: { type: string, format: date }, description: "Primer día, desde las 00:00:00 en hora de Madrid, incluido (FR-022)" }
        - { name: hasta, in: query, required: true, schema: { type: string, format: date }, description: "Último día, hasta las 23:59:59 en hora de Madrid, incluido. No puede ser anterior a `desde` (422 `validacion`)" }
      responses:
        "200":
          description: "ZIP (contracts/exportacion.md). `filename`: `registros-facturacion-AAAAMMDD-AAAAMMDD.zip` o `registros-eventos-…`"
          headers:
            Content-Disposition: { schema: { type: string }, example: 'attachment; filename="registros-facturacion-20260101-20261231.zip"' }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "403": { $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Prohibido" }
        "409": { description: "`emision-no-disponible`: no se puede firmar el evento de exportación sin certificado", $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Problema" }
        "422": { description: "`validacion` o `sin-registros`", $ref: "../../001-cimientos-clientes/contracts/openapi.yaml#/components/responses/Validacion" }

components:
  parameters:
    Secuencia:
      name: secuencia
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  schemas:
    TipoEventoSif:
      type: string
      enum: ["01", "02", "03", "04", "05", "06", "08", "09", "10"]
      description: F-17, TipoEventoType. El 07 y el 90 no se generan

    EstadoCertificado:
      type: object
      required: [estado, motivo, caduca_pronto]
      properties:
        estado: { type: string, enum: [utilizable, no_utilizable] }
        motivo:
          oneOf:
            - type: string
              enum: [no_instalado, ilegible, caducado, aun_no_valido, sin_clave_privada, no_apto_para_firmar, de_pruebas_en_produccion]
            - type: "null"
        titular: { type: [string, "null"] }
        identificacion: { type: [string, "null"] }
        emisor: { type: [string, "null"] }
        valido_desde: { type: [string, "null"], format: date-time }
        valido_hasta: { type: [string, "null"], format: date-time }
        dias_restantes: { type: [integer, "null"] }
        caduca_pronto: { type: boolean, description: "30 días o menos (FR-003)" }

    Alarma:
      type: object
      required: [tipo, mensaje, desde]
      properties:
        tipo: { type: string, enum: [integridad, certificado] }
        mensaje: { type: string }
        desde: { type: string, format: date-time }
        secuencia_afectada: { type: [integer, "null"] }

    AlarmasSalida:
      type: object
      required: [alarmas]
      properties:
        alarmas: { type: array, items: { $ref: "#/components/schemas/Alarma" } }

    DeclaracionApartado:
      type: object
      required: [letra, texto, valor]
      properties:
        letra: { type: string, examples: ["a"] }
        texto: { type: string, description: "Texto descriptivo del art. 15.1 de la Orden" }
        valor: { type: string }

    SistemaSalida:
      type: object
      required: [nombre, id_sistema, version, numero_instalacion, productor, declaracion]
      properties:
        nombre: { type: string }
        id_sistema: { type: string }
        version: { type: string }
        numero_instalacion: { type: string }
        productor:
          type: object
          required: [nombre, nif, direccion]
          properties:
            nombre: { type: string }
            nif: { type: string }
            direccion: { type: string }
        modalidad: { type: string, enum: [no_verifactu] }
        declaracion:
          type: object
          required: [titulo, apartados]
          properties:
            titulo: { type: string, const: "DECLARACIÓN RESPONSABLE DEL SISTEMA INFORMÁTICO DE FACTURACIÓN" }
            apartados: { type: array, items: { $ref: "#/components/schemas/DeclaracionApartado" } }

    EventoSifResumen:
      type: object
      required: [secuencia, tipo_evento, fecha_hora_huso_gen, huella, certificado_titular]
      properties:
        secuencia: { type: integer }
        tipo_evento: { $ref: "#/components/schemas/TipoEventoSif" }
        fecha_hora_huso_gen: { type: string }
        huella: { type: string }
        certificado_titular: { type: string }
        resumen: { type: [string, "null"], description: "Una línea legible de sus datos propios" }

    PaginaEventosSif:
      type: object
      required: [elementos, total, pagina, tamano]
      properties:
        elementos: { type: array, items: { $ref: "#/components/schemas/EventoSifResumen" } }
        total: { type: integer }
        pagina: { type: integer }
        tamano: { type: integer }

    Salto:
      type: object
      description: Un salto de la cadena al anterior o al siguiente (Orden, art. 7.h)
      required: [secuencia, encadenamiento_correcto, fechas_en_orden]
      properties:
        secuencia: { type: integer }
        encadenamiento_correcto: { type: boolean }
        fechas_en_orden: { type: boolean, description: "Entre sí y con la hora actual" }

    EventoSifDetalle:
      allOf:
        - $ref: "#/components/schemas/EventoSifResumen"
        - type: object
          required: [datos, huella_correcta, firma_correcta]
          properties:
            datos: { type: object, additionalProperties: true, description: "DatosPropiosEvento (F-17)" }
            huella_correcta: { type: boolean }
            firma_correcta: { type: boolean }
            anterior: { oneOf: [{ $ref: "#/components/schemas/Salto" }, { type: "null" }] }
            siguiente: { oneOf: [{ $ref: "#/components/schemas/Salto" }, { type: "null" }] }

    RegistroCadenaDetalle:
      type: object
      required: [secuencia, tipo, num_serie, factura_id, fecha_hora_huso_gen, huella, huella_correcta, firma_correcta]
      properties:
        secuencia: { type: integer }
        tipo: { type: string, enum: [alta, anulacion] }
        num_serie: { type: string }
        factura_id: { type: string, format: uuid }
        fecha_hora_huso_gen: { type: string }
        huella: { type: string }
        certificado_titular: { type: [string, "null"] }
        huella_correcta: { type: boolean }
        firma_correcta: { type: [boolean, "null"], description: "Nulo si el registro no lleva firma (VERI*FACTU)" }
        anterior: { oneOf: [{ $ref: "#/components/schemas/Salto" }, { type: "null" }] }
        siguiente: { oneOf: [{ $ref: "#/components/schemas/Salto" }, { type: "null" }] }

    ComprobacionEntrada:
      type: object
      additionalProperties: false
      properties:
        desde_secuencia: { type: [integer, "null"], minimum: 1, description: "Sin valor: desde el primero" }
        hasta_secuencia: { type: [integer, "null"], minimum: 1, description: "Sin valor: hasta el último" }

    Anomalia:
      type: object
      required: [cadena, tipo_anomalia, descripcion]
      properties:
        cadena: { type: string, enum: [facturacion, eventos] }
        tipo_anomalia: { type: string, description: "F-17, TipoAnomaliaType (research R-10)" }
        descripcion: { type: string }
        secuencia: { type: [integer, "null"] }

    ComprobacionSalida:
      type: object
      required: [integra, registros, eventos, anomalias]
      properties:
        integra: { type: boolean }
        registros: { type: integer }
        eventos: { type: integer }
        anomalias: { type: array, items: { $ref: "#/components/schemas/Anomalia" } }
